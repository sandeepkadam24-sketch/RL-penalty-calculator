<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Loss Calculator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        h2 {
            margin-bottom: 20px;
            color: #0f172a;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .result-box {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-box.highlight-eur {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .result-box.highlight-inr {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .result-label {
            font-size: 0.875rem;
            color: #334155;
            font-weight: 500;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .text-danger { color: var(--danger); }
        .text-success { color: var(--success); }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Retail Loss & Penalty Calculator</h2>

    <div class="grid-container">
        <!-- INPUTS -->
        <div>
            <div class="section-title">Input Values</div>

            <div class="input-group">
                <label for="lossCount">1. Retail Loss Count</label>
                <input type="number" id="lossCount" value="120" min="0" oninput="calculate()">
            </div>

            <div class="input-group">
                <label for="totalTxns">2. Total Transactions</label>
                <input type="number" id="totalTxns" value="50000" min="1" oninput="calculate()">
            </div>

            <div class="input-group">
                <label for="errorValEur">3. Error Value (€ Euro)</label>
                <input type="number" id="errorValEur" value="2400" min="0" step="0.01" oninput="calculate()">
            </div>

            <div class="input-group">
                <label for="quarterTarget">4. Quarter Target (Allowed Loss / 1k Txns)</label>
                <input type="number" id="quarterTarget" value="2.0" min="0" step="0.1" oninput="calculate()">
            </div>

            <div class="input-group">
                <label for="eurToInrRate">EUR to INR Exchange Rate (₹)</label>
                <input type="number" id="eurToInrRate" value="90.50" min="0" step="0.01" oninput="calculate()">
            </div>
        </div>

        <!-- OUTPUTS -->
        <div>
            <div class="section-title">Calculated Results</div>

            <div class="result-box">
                <span class="result-label">1. Errors / 1000 Transactions</span>
                <span class="result-value" id="resErrorsPer1k">0</span>
            </div>

            <div class="result-box">
                <span class="result-label">2. Average Error Value</span>
                <span class="result-value" id="resAvgErrorVal">€0.00</span>
            </div>

            <div class="result-box">
                <span class="result-label">3. Losses Allowed</span>
                <span class="result-value" id="resLossesAllowed">0</span>
            </div>

            <div class="result-box">
                <span class="result-label">4. Additional Losses</span>
                <span class="result-value" id="resAddLosses">0</span>
            </div>

            <div class="result-box highlight-eur">
                <span class="result-label">5. Penalty (€)</span>
                <span class="result-value text-danger" id="resPenaltyEur">€0.00</span>
            </div>

            <div class="result-box highlight-inr">
                <span class="result-label">6. Penalty (₹ INR)</span>
                <span class="result-value text-success" id="resPenaltyInr">₹0.00</span>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // Fetch inputs
        const lossCount = parseFloat(document.getElementById('lossCount').value) || 0;
        const totalTxns = parseFloat(document.getElementById('totalTxns').value) || 0;
        const errorValEur = parseFloat(document.getElementById('errorValEur').value) || 0;
        const quarterTarget = parseFloat(document.getElementById('quarterTarget').value) || 0;
        const eurToInrRate = parseFloat(document.getElementById('eurToInrRate').value) || 0;

        // 1. Error / 1000 transactions = loss count / total transactions * 1000
        const errorsPer1k = totalTxns > 0 ? (lossCount / totalTxns) * 1000 : 0;

        // 2. Average error value = error value / retail loss count
        const avgErrorVal = lossCount > 0 ? (errorValEur / lossCount) : 0;

        // 3. Losses allowed = quarter target / 1000 * total transactions
        const lossesAllowed = (quarterTarget / 1000) * totalTxns;

        // 4. Additional losses = total retail loss count - losses allowed
        const addLossesRaw = lossCount - lossesAllowed;
        const addLosses = addLossesRaw > 0 ? addLossesRaw : 0; // Avoid negative additional losses

        // 5. Penalty in Euro = Average error value x Additional losses
        const penaltyEur = avgErrorVal * addLosses;

        // 6. Penalty in INR = Penalty EUR x EUR/INR Exchange Rate
        const penaltyInr = penaltyEur * eurToInrRate;

        // Render Results
        document.getElementById('resErrorsPer1k').textContent = errorsPer1k.toFixed(2);
        
        document.getElementById('resAvgErrorVal').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(avgErrorVal);

        document.getElementById('resLossesAllowed').textContent = lossesAllowed.toFixed(2);
        
        document.getElementById('resAddLosses').textContent = addLosses.toFixed(2);

        document.getElementById('resPenaltyEur').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(penaltyEur);

        document.getElementById('resPenaltyInr').textContent = new Intl.NumberFormat('en-IN', {
            style: 'currency', currency: 'INR'
        }).format(penaltyInr);
    }

    // Run on page load
    calculate();
</script>

</body>
</html>
