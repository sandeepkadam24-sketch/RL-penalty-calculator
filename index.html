<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Loss & Penalty Calculator</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F17;
            --card-bg: #111827;
            --card-border: #1F293D;
            --card-hover: #1A2333;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-blue: #3B82F6;
            --accent-cyan: #06B6D4;
            --accent-emerald: #10B981;
            --accent-rose: #F43F5E;
            --accent-amber: #F59E0B;
            --accent-purple: #8B5CF6;
            --gradient-primary: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            --gradient-danger: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%);
            --gradient-success: linear-gradient(135deg, #10B981 0%, #047857 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Banner Header */
        .hero-banner {
            position: relative;
            height: 180px;
            background: linear-gradient(to right, rgba(11, 15, 23, 0.95), rgba(11, 15, 23, 0.7)),
                        url('https://images.unsplash.com/photo-1556742049-0a670f4a4591?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding: 0 35px;
            border-bottom: 1px solid var(--card-border);
        }

        .hero-title {
            z-index: 2;
        }

        .hero-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, #93C5FD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero-title p {
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        /* Grid Content */
        .grid-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 30px;
            padding: 35px;
        }

        @media (max-width: 850px) {
            .grid-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 22px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-header i {
            color: var(--accent-blue);
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            background: #0B0F17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .input-wrapper input:focus + i {
            color: var(--accent-blue);
        }

        /* Output Metrics Grid */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 500px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric-card {
            background: #0B0F17;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .metric-card.full-width {
            grid-column: 1 / -1;
        }

        .metric-card.highlight-eur {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(17, 24, 39, 0.9) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .metric-card.highlight-inr {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(17, 24, 39, 0.9) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .metric-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .value-eur {
            color: #F87171;
            font-size: 1.4rem;
        }

        .value-inr {
            color: #34D399;
            font-size: 1.4rem;
        }

        .currency-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            margin-left: auto;
        }

        .badge-eur { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; }
        .badge-inr { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; }

    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- HERO BANNER WITH IMAGE OVERLAY -->
    <div class="hero-banner">
        <div class="hero-title">
            <h1><i class="fa-solid fa-chart-line text-accent"></i> Retail Loss Calculator</h1>
            <p>Monitor shrink rates, extra loss margins, and automated penalty conversion.</p>
        </div>
    </div>

    <!-- MAIN CALCULATOR WRAPPER -->
    <div class="grid-wrapper">
        <!-- LEFT COLUMN: INPUT CONTROLS -->
        <div class="inputs-column">
            <div class="section-header">
                <i class="fa-solid fa-sliders"></i> Parameters
            </div>

            <div class="input-group">
                <label for="lossCount"><i class="fa-solid fa-boxes-packing"></i> Retail Loss Count</label>
                <div class="input-wrapper">
                    <input type="number" id="lossCount" value="120" min="0" oninput="calculate()">
                    <i class="fa-solid fa-calculator"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="totalTxns"><i class="fa-solid fa-receipt"></i> Total Transactions</label>
                <div class="input-wrapper">
                    <input type="number" id="totalTxns" value="50000" min="1" oninput="calculate()">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="errorValEur"><i class="fa-solid fa-euro-sign"></i> Total Error Value (€ EUR)</label>
                <div class="input-wrapper">
                    <input type="number" id="errorValEur" value="2400" min="0" step="0.01" oninput="calculate()">
                    <i class="fa-solid fa-coins"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="quarterTarget"><i class="fa-solid fa-crosshair"></i> Quarter Target (Allowed / 1k Txns)</label>
                <div class="input-wrapper">
                    <input type="number" id="quarterTarget" value="2.0" min="0" step="0.1" oninput="calculate()">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="eurToInrRate"><i class="fa-solid fa-globe"></i> EUR to INR Exchange Rate (₹)</label>
                <div class="input-wrapper">
                    <input type="number" id="eurToInrRate" value="90.50" min="0" step="0.01" oninput="calculate()">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: COMPUTED METRICS -->
        <div class="outputs-column">
            <div class="section-header">
                <i class="fa-solid fa-chart-pie"></i> Metrics & Output
            </div>

            <div class="results-grid">
                <!-- 1. Errors / 1000 Transactions -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-percent" style="color: var(--accent-cyan);"></i> Error / 1k Txns
                    </div>
                    <div class="metric-value" id="resErrorsPer1k">0</div>
                </div>

                <!-- 2. Avg Error Value -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-scale-balanced" style="color: var(--accent-amber);"></i> Avg Error Value
                    </div>
                    <div class="metric-value" id="resAvgErrorVal">€0.00</div>
                </div>

                <!-- 3. Losses Allowed -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-shield-check" style="color: var(--accent-emerald);"></i> Losses Allowed
                    </div>
                    <div class="metric-value" id="resLossesAllowed">0</div>
                </div>

                <!-- 4. Additional Losses -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-triangle-exclamation" style="color: var(--accent-rose);"></i> Additional Losses
                    </div>
                    <div class="metric-value" id="resAddLosses">0</div>
                </div>

                <!-- 5. Penalty in EUR -->
                <div class="metric-card full-width highlight-eur">
                    <div class="metric-title">
                        <i class="fa-solid fa-circle-exclamation" style="color: #F87171;"></i> Penalty (Euro)
                        <span class="currency-badge badge-eur">EUR</span>
                    </div>
                    <div class="metric-value value-eur" id="resPenaltyEur">€0.00</div>
                </div>

                <!-- 6. Penalty in INR -->
                <div class="metric-card full-width highlight-inr">
                    <div class="metric-title">
                        <i class="fa-solid fa-money-bill-transfer" style="color: #34D399;"></i> Penalty (INR)
                        <span class="currency-badge badge-inr">INR</span>
                    </div>
                    <div class="metric-value value-inr" id="resPenaltyInr">₹0.00</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // Fetch inputs
        const lossCount = parseFloat(document.getElementById('lossCount').value) || 0;
        const totalTxns = parseFloat(document.getElementById('totalTxns').value) || 0;
        const errorValEur = parseFloat(document.getElementById('errorValEur').value) || 0;
        const quarterTarget = parseFloat(document.getElementById('quarterTarget').value) || 0;
        const eurToInrRate = parseFloat(document.getElementById('eurToInrRate').value) || 0;

        // 1. Error / 1000 transactions = retail loss count / total transactions * 1000
        const errorsPer1k = totalTxns > 0 ? (lossCount / totalTxns) * 1000 : 0;

        // 2. Average error value = error value / retail loss count
        const avgErrorVal = lossCount > 0 ? (errorValEur / lossCount) : 0;

        // 3. Losses allowed = quarter target / 1000 * total transactions
        const lossesAllowed = (quarterTarget / 1000) * totalTxns;

        // 4. Additional losses = total retail loss count - losses allowed
        const addLossesRaw = lossCount - lossesAllowed;
        const addLosses = addLossesRaw > 0 ? addLossesRaw : 0; // Clamped at 0 if no excess loss

        // 5. Penalty in Euro = Average error value x Additional losses
        const penaltyEur = avgErrorVal * addLosses;

        // 6. Penalty in INR = Penalty EUR x EUR/INR Exchange Rate
        const penaltyInr = penaltyEur * eurToInrRate;

        // Format and render output values
        document.getElementById('resErrorsPer1k').textContent = errorsPer1k.toFixed(2);
        
        document.getElementById('resAvgErrorVal').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(avgErrorVal);

        document.getElementById('resLossesAllowed').textContent = lossesAllowed.toFixed(2);
        
        document.getElementById('resAddLosses').textContent = addLosses.toFixed(2);

        document.getElementById('resPenaltyEur').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(penaltyEur);

        document.getElementById('resPenaltyInr').textContent = new Intl.NumberFormat('en-IN', {
            style: 'currency', currency: 'INR'
        }).format(penaltyInr);
    }

    // Initial run on load
    calculate();
</script>

</body>
</html>
