<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Loss Calculator</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F17;
            --card-bg: #111827;
            --card-border: #1F293D;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-blue: #3B82F6;
            --accent-cyan: #06B6D4;
            --accent-emerald: #10B981;
            --accent-rose: #F43F5E;
            --accent-amber: #F59E0B;
            --btn-clear-bg: #1E293B;
            --btn-clear-hover: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Fits cleanly inside view frame */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 1050px; /* Expanded width for desktops */
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Header */
        .top-header {
            padding: 16px 28px;
            background: rgba(17, 24, 39, 0.85);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            font-size: 1.3rem;
            color: var(--accent-blue);
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #FFFFFF, #93C5FD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(6, 182, 212, 0.25);
            font-weight: 600;
        }

        /* Grid Content Layout */
        .grid-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 28px;
        }

        @media (max-width: 800px) {
            body { overflow-y: auto; height: auto; }
            .grid-wrapper { grid-template-columns: 1fr; }
        }

        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Clear Button */
        .btn-clear {
            background: var(--btn-clear-bg);
            color: #F3F4F6;
            border: 1px solid var(--card-border);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            background: var(--btn-clear-hover);
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--accent-rose);
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrapper input {
            width: 100%;
            background: #0B0F17;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 9px 12px 9px 36px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Output Metrics Grid */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .metric-card {
            background: #0B0F17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-card.full-width {
            grid-column: 1 / -1;
        }

        .metric-card.highlight-eur {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(17, 24, 39, 0.9) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .metric-card.highlight-inr {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(17, 24, 39, 0.9) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .metric-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .value-eur { color: #F87171; font-size: 1.3rem; }
        .value-inr { color: #34D399; font-size: 1.3rem; }

        .currency-badge {
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: auto;
        }

        .badge-eur { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; }
        .badge-inr { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; }

    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- TOP HEADER BAR -->
    <div class="top-header">
        <div class="header-title">
            <i class="fa-solid fa-chart-pie"></i>
            <h1>Retail Loss Calculator</h1>
        </div>
        <span class="header-badge"><i class="fa-solid fa-bolt"></i> Realtime</span>
    </div>

    <!-- MAIN CALCULATOR GRID -->
    <div class="grid-wrapper">
        <!-- LEFT COLUMN: INPUT CONTROLS -->
        <div class="inputs-column">
            <div class="section-header-bar">
                <div class="section-header">
                    <i class="fa-solid fa-sliders"></i> Input Parameters
                </div>
                <button class="btn-clear" onclick="clearInputs()">
                    <i class="fa-solid fa-rotate-left"></i> Clear Inputs
                </button>
            </div>

            <div class="input-group">
                <label for="lossCount"><i class="fa-solid fa-boxes-packing"></i> Retail Loss Count</label>
                <div class="input-wrapper">
                    <input type="number" id="lossCount" value="120" min="0" oninput="calculate()">
                    <i class="fa-solid fa-calculator"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="totalTxns"><i class="fa-solid fa-receipt"></i> Total Transactions</label>
                <div class="input-wrapper">
                    <input type="number" id="totalTxns" value="50000" min="1" oninput="calculate()">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="errorValEur"><i class="fa-solid fa-euro-sign"></i> Total Error Value (€ EUR)</label>
                <div class="input-wrapper">
                    <input type="number" id="errorValEur" value="2400" min="0" step="0.01" oninput="calculate()">
                    <i class="fa-solid fa-coins"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="quarterTarget"><i class="fa-solid fa-crosshair"></i> Quarter Target (Allowed / 1k)</label>
                <div class="input-wrapper">
                    <input type="number" id="quarterTarget" value="2.0" min="0" step="0.1" oninput="calculate()">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="eurToInrRate"><i class="fa-solid fa-globe"></i> EUR to INR Rate (₹)</label>
                <div class="input-wrapper">
                    <input type="number" id="eurToInrRate" value="109.74" min="0" step="0.01" oninput="calculate()">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: COMPUTED METRICS -->
        <div class="outputs-column">
            <div class="section-header-bar">
                <div class="section-header">
                    <i class="fa-solid fa-square-poll-vertical"></i> Output Metrics
                </div>
            </div>

            <div class="results-grid">
                <!-- 1. Errors / 1000 Transactions -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-percent" style="color: var(--accent-cyan);"></i> Error / 1k Txns
                    </div>
                    <div class="metric-value" id="resErrorsPer1k">0</div>
                </div>

                <!-- 2. Avg Error Value -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-scale-balanced" style="color: var(--accent-amber);"></i> Avg Error Value
                    </div>
                    <div class="metric-value" id="resAvgErrorVal">€0.00</div>
                </div>

                <!-- 3. Losses Allowed -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-shield-check" style="color: var(--accent-emerald);"></i> Losses Allowed
                    </div>
                    <div class="metric-value" id="resLossesAllowed">0</div>
                </div>

                <!-- 4. Additional Losses -->
                <div class="metric-card">
                    <div class="metric-title">
                        <i class="fa-solid fa-triangle-exclamation" style="color: var(--accent-rose);"></i> Extra Losses
                    </div>
                    <div class="metric-value" id="resAddLosses">0</div>
                </div>

                <!-- 5. Penalty in EUR -->
                <div class="metric-card full-width highlight-eur">
                    <div class="metric-title">
                        <i class="fa-solid fa-circle-exclamation" style="color: #F87171;"></i> Penalty (Euro)
                        <span class="currency-badge badge-eur">EUR</span>
                    </div>
                    <div class="metric-value value-eur" id="resPenaltyEur">€0.00</div>
                </div>

                <!-- 6. Penalty in INR -->
                <div class="metric-card full-width highlight-inr">
                    <div class="metric-title">
                        <i class="fa-solid fa-money-bill-transfer" style="color: #34D399;"></i> Penalty (INR)
                        <span class="currency-badge badge-inr">INR</span>
                    </div>
                    <div class="metric-value value-inr" id="resPenaltyInr">₹0.00</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const lossCount = parseFloat(document.getElementById('lossCount').value) || 0;
        const totalTxns = parseFloat(document.getElementById('totalTxns').value) || 0;
        const errorValEur = parseFloat(document.getElementById('errorValEur').value) || 0;
        const quarterTarget = parseFloat(document.getElementById('quarterTarget').value) || 0;
        const eurToInrRate = parseFloat(document.getElementById('eurToInrRate').value) || 0;

        // 1. Error / 1000 transactions
        const errorsPer1k = totalTxns > 0 ? (lossCount / totalTxns) * 1000 : 0;

        // 2. Average error value
        const avgErrorVal = lossCount > 0 ? (errorValEur / lossCount) : 0;

        // 3. Losses allowed
        const lossesAllowed = (quarterTarget / 1000) * totalTxns;

        // 4. Additional losses
        const addLossesRaw = lossCount - lossesAllowed;
        const addLosses = addLossesRaw > 0 ? addLossesRaw : 0;

        // 5. Penalty in Euro
        const penaltyEur = avgErrorVal * addLosses;

        // 6. Penalty in INR
        const penaltyInr = penaltyEur * eurToInrRate;

        // Render Outputs
        document.getElementById('resErrorsPer1k').textContent = errorsPer1k.toFixed(2);
        
        document.getElementById('resAvgErrorVal').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(avgErrorVal);

        document.getElementById('resLossesAllowed').textContent = lossesAllowed.toFixed(2);
        
        document.getElementById('resAddLosses').textContent = addLosses.toFixed(2);

        document.getElementById('resPenaltyEur').textContent = new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR'
        }).format(penaltyEur);

        document.getElementById('resPenaltyInr').textContent = new Intl.NumberFormat('en-IN', {
            style: 'currency', currency: 'INR'
        }).format(penaltyInr);
    }

    // Function to clear all fields EXCEPT Quarter Target & Exchange Rate
    function clearInputs() {
        document.getElementById('lossCount').value = '';
        document.getElementById('totalTxns').value = '';
        document.getElementById('errorValEur').value = '';
        calculate(); // Recalculate outputs after clearing
    }

    calculate();
</script>

</body>
</html>
